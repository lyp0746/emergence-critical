<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="820" height="470" fill="#ffffff"/>
<text x="410.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">慢化是可测的，但它不告诉你“何时”</text>
<text x="410.0" y="62" text-anchor="middle" font-size="14" fill="#666666">AR(1)：恢复时间 τ 与方差随 a→1 同步发散（双对数）</text>
<line x1="100" y1="370" x2="720" y2="370" stroke="#333" stroke-width="1.8"/>
<line x1="100" y1="370" x2="100" y2="120" stroke="#333" stroke-width="1.8"/>
<text x="410.0" y="410" text-anchor="middle" font-size="13" fill="#666666">1/(1−a)（对数轴）</text>
<text x="48" y="245.0" text-anchor="middle" font-size="13" fill="#666666" transform="rotate(-90 48 245.0)">τ 与方差（对数轴）</text>
<path d="M141.3,316.4 L265.6,274.9 L554.4,177.9 L678.7,133.8" fill="none" stroke="#2f6db0" stroke-width="2.6"/>
<circle cx="141.3" cy="316.4" r="3.4" fill="#2f6db0"/>
<circle cx="265.6" cy="274.9" r="3.4" fill="#2f6db0"/>
<circle cx="554.4" cy="177.9" r="3.4" fill="#2f6db0"/>
<circle cx="678.7" cy="133.8" r="3.4" fill="#2f6db0"/>
<text x="686.7" y="137.8" font-size="12" fill="#2f6db0" font-weight="bold">实测 τ</text>
<path d="M141.3,356.2 L265.6,314.8 L554.4,219.0 L678.7,177.3" fill="none" stroke="#ef6c00" stroke-width="2.6"/>
<circle cx="141.3" cy="356.2" r="3.4" fill="#ef6c00"/>
<circle cx="265.6" cy="314.8" r="3.4" fill="#ef6c00"/>
<circle cx="554.4" cy="219.0" r="3.4" fill="#ef6c00"/>
<circle cx="678.7" cy="177.3" r="3.4" fill="#ef6c00"/>
<text x="686.7" y="181.3" font-size="12" fill="#ef6c00" font-weight="bold">实测方差</text>
<text x="410.0" y="454" text-anchor="middle" font-size="12" fill="#666666">指标能报“越来越近”，却报不出“哪一天翻过去”——这是预警的结构性边界。</text>
</svg>