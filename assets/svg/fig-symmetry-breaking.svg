<text x="590" y="110" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">临界点后：对齐（破缺）</text>
<line x1="485" y1="320" x2="485" y2="200" stroke="#c62828" stroke-width="2"/>
<circle cx="485" cy="200" r="7" fill="#c62828"/>
<circle cx="485" cy="320" r="7" fill="#c62828"/>
