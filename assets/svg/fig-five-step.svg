<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="940" height="300" fill="#ffffff"/>
<text x="470" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">五步诊断流程：拿到一个陌生系统，怎么判断它刚经历了一次质变</text>
<rect x="30.0" y="110" width="160" height="90" rx="8" fill="#fbfcfe" stroke="#b8862f" stroke-width="1.4"/>
<text x="110.0" y="145" text-anchor="middle" font-size="15" fill="#b8862f" font-weight="bold">1 找序参量</text>
<text x="110.0" y="175" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">什么量从≈0变非0</text>
<line x1="190.0" y1="155" x2="210.0" y2="155" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<rect x="210.0" y="110" width="160" height="90" rx="8" fill="#fbfcfe" stroke="#b8862f" stroke-width="1.4"/>
<text x="290.0" y="145" text-anchor="middle" font-size="15" fill="#b8862f" font-weight="bold">2 定临界点</text>
<text x="290.0" y="175" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">一阶跳变还是二阶</text>
<line x1="370.0" y1="155" x2="390.0" y2="155" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<rect x="390.0" y="110" width="160" height="90" rx="8" fill="#fbfcfe" stroke="#b8862f" stroke-width="1.4"/>
<text x="470.0" y="145" text-anchor="middle" font-size="15" fill="#b8862f" font-weight="bold">3 看预警</text>
<text x="470.0" y="175" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">恢复是否变慢</text>
<line x1="550.0" y1="155" x2="570.0" y2="155" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<rect x="570.0" y="110" width="160" height="90" rx="8" fill="#fbfcfe" stroke="#b8862f" stroke-width="1.4"/>
<text x="650.0" y="145" text-anchor="middle" font-size="15" fill="#b8862f" font-weight="bold">4 算有效信息</text>
<text x="650.0" y="175" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">宏观是否更好用</text>
<line x1="730.0" y1="155" x2="750.0" y2="155" stroke="#666" stroke-width="2" marker-end="url(#ah)"/>
<rect x="750.0" y="110" width="160" height="90" rx="8" fill="#fbfcfe" stroke="#b8862f" stroke-width="1.4"/>
<text x="830.0" y="145" text-anchor="middle" font-size="15" fill="#b8862f" font-weight="bold">5 标等级</text>
<text x="830.0" y="175" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">三中→强，一中→弱</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666"/></marker></defs>
<text x="470.0" y="255" text-anchor="middle" font-size="14" fill="#666" font-weight="normal">三个标记都测不到 → 别叫它质变，叫它“退化”或“波动”。</text>
</svg>