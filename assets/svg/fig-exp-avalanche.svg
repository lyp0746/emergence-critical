<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">临界雪崩：只有“刚刚好”的系统才有幂律</text>
<text x="450" y="62" text-anchor="middle" font-size="14" fill="#666666">临界分支过程（m=1）的规模分布斜率 ≈ 3/2；偏离临界，尾巴被截断（曲线在 s=50 处归一）</text>
<line x1="110" y1="400" x2="800" y2="400" stroke="#333" stroke-width="1.8"/>
<line x1="110" y1="400" x2="110" y2="100" stroke="#333" stroke-width="1.8"/>
<text x="455.0" y="440.0" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">雪崩规模 s（对数轴）</text>
<text x="64" y="250.0" text-anchor="middle" font-size="13" fill="#666666" transform="rotate(-90 64 250.0)">归一化后的密度 n(s)（对数轴）</text>
<line x1="65.0" y1="400" x2="65.0" y2="405" stroke="#333"/>
<text x="65.0" y="420.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">10</text>
<line x1="365.0" y1="400" x2="365.0" y2="405" stroke="#333"/>
<text x="365.0" y="420.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">100</text>
<line x1="665.0" y1="400" x2="665.0" y2="405" stroke="#333"/>
<text x="665.0" y="420.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">1000</text>
<line x1="105" y1="128.0" x2="110" y2="128.0" stroke="#333"/>
<text x="100.0" y="132.0" text-anchor="end" font-size="12" fill="#666666" font-weight="normal">1</text>
<line x1="105" y1="208.0" x2="110" y2="208.0" stroke="#333"/>
<text x="100.0" y="212.0" text-anchor="end" font-size="12" fill="#666666" font-weight="normal">0.1</text>
<line x1="105" y1="288.0" x2="110" y2="288.0" stroke="#333"/>
<text x="100.0" y="292.0" text-anchor="end" font-size="12" fill="#666666" font-weight="normal">0.01</text>
<line x1="105" y1="368.0" x2="110" y2="368.0" stroke="#333"/>
<text x="100.0" y="372.0" text-anchor="end" font-size="12" fill="#666666" font-weight="normal">0.001</text>
<path d="M128.3,58.1 L149.1,73.2 L169.9,78.8 L190.8,94.6 L211.6,101.0 L232.4,108.5 L253.3,125.3 L274.1,127.8 L295.0,135.9 L315.8,149.9 L336.7,159.7 L357.5,171.6 L378.3,180.9" fill="none" stroke="#2e7d32" stroke-width="2.6"/>
<text x="384.3" y="172.9" text-anchor="start" font-size="12" fill="#2e7d32" font-weight="bold">m=0.9</text>
<path d="M295.2,128.0 L336.2,145.8 L377.3,160.2 L418.3,178.8 L459.3,194.2 L500.4,211.0 L541.4,226.0 L582.4,242.5 L623.5,260.5 L664.5,274.1 L705.6,292.3 L746.6,311.4 L787.6,323.2" fill="none" stroke="#c62828" stroke-width="2.6"/>
<text x="793.6" y="315.2" text-anchor="start" font-size="12" fill="#c62828" font-weight="bold">m=1.0</text>
<path d="M295.2,128.0 L336.2,146.2 L377.3,164.2 L418.3,182.0 L459.3,202.7 L500.4,219.6 L541.4,240.8 L582.4,265.1 L623.5,286.4 L664.5,313.7 L705.6,347.3 L746.6,387.3 L787.6,415.8" fill="none" stroke="#ef6c00" stroke-width="2.6"/>
<text x="793.6" y="407.8" text-anchor="start" font-size="12" fill="#ef6c00" font-weight="bold">m=1.05</text>
<line x1="274.7" y1="128.0" x2="598.4" y2="257.5" stroke="#666666" stroke-width="1.8" stroke-dasharray="8,5"/>
<text x="598.4" y="277.5" text-anchor="end" font-size="12" fill="#666666" font-weight="normal">参考斜率 −3/2</text>
<text x="450.0" y="478.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">实测幂律指数：m=1.0 → α=1.495（拟合窗口 50–3000）；m=0.9 → 1.786（15–120）；m=1.05 → 2.146（50–3000，9.3% 截断）。</text>
<text x="450.0" y="500.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">偏离临界时，“幂律”不是消失了，而是被一个指数截断接管——这正是把临界当“开关”会犯的错。</text>
</svg>